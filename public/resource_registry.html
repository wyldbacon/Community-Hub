<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Group Registry</title>
  <style>
    :root{
      --green-600:#66bb6a;
      --green-700:#388e3c;
      --accent:#2a7a4d;
      --bg:#fff;
      --card-shadow:0 6px 18px rgba(0,0,0,0.12);
      --soft-shadow:0 2px 6px rgba(0,0,0,0.05);
      --radius:12px;
      --container:1100px;
      --resource-w:100%;
      --gap:14px;
      --font:Arial, Helvetica, sans-serif;
    }
    *{box-sizing:border-box}
    body{font-family:var(--font);margin:0;background:#f4fbf6;color:#17221a;padding:24px}
    .wrap{max-width:var(--container);margin:0 auto}

    header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px;flex-wrap:wrap}
    h1{font-size:1.6rem;color:var(--accent);margin:0}
    .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

    /* nav buttons */
    .nav-buttons {
      display:flex;
      gap:10px;
      margin-bottom:10px;
    }
    .nav-buttons button {
      padding:8px 14px;
      border:none;
      border-radius:8px;
      background:var(--green-600);
      color:#fff;
      font-weight:600;
      cursor:pointer;
    }
    .nav-buttons button:hover {
      background:var(--green-700);
    }

    /* add resource button with hover menu */
    .add-group{position:relative}
    .add-btn{background:var(--green-600);border:none;color:white;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:700}
    .add-btn:hover{background:var(--green-700)}
    .add-menu{position:absolute;right:0;top:110%;background:var(--bg);box-shadow:var(--soft-shadow);border-radius:8px;overflow:hidden;display:none}
    .add-group:hover .add-menu{display:block}
    .add-menu button{display:block;padding:10px 14px;border:none;background:transparent;width:200px;text-align:left;cursor:pointer}
    .add-menu button:hover{background:#f1f8f4}

    /* Form area (hidden until selecting offering/request) */
    .form-area{margin:12px 0 18px;background:var(--bg);padding:14px;border-radius:10px;box-shadow:var(--soft-shadow);display:none}
    .form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
    label{font-size:0.9rem;color:#14331f}
    input[type=text],select,textarea{width:100%;padding:8px;border-radius:8px;border:1px solid #dcefe0;background:#fff}
    textarea{min-height:80px;resize:vertical}

    .form-actions{display:flex;gap:10px;align-items:center}
    .btn-ghost{background:transparent;border:1px solid #cfe9cf;padding:8px 12px;border-radius:8px;cursor:pointer}

    /* registry list */
    .registry{margin-top:8px;display:flex;flex-direction:column;gap:10px}
    .resource-bar{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:10px;padding:10px 12px;box-shadow:var(--soft-shadow);gap:12px}
    .resource-meta{display:flex;gap:12px;align-items:center;min-width:0}
    .resource-title{font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}
    .resource-address{font-size:0.85rem;padding:5px 8px;border-radius:999px;background:#fafdfb;border:1px solid #e7f6ea}
    .resource-type{font-size:0.86rem;padding:6px 8px;border-radius:8px;background:#f1fbf1;border:1px solid #e3f4e6}
    .resource-tag{font-size:0.85rem;padding:5px 8px;border-radius:999px;background:#fafdfb;border:1px solid #e7f6ea}

    .resource-actions{display:flex;gap:8px;align-items:center}
    .arrow-btn{background:transparent;border:none;font-size:18px;cursor:pointer;padding:6px;border-radius:6px}

    .collapsed-details{display:none}
    .resource-bar.open + .collapsed-details{display:block;background:#fbfff9;padding:12px;border-radius:8px;border:1px solid #eef9ee;margin-top:-6px}
    .detail-row{display:flex;gap:12px;flex-wrap:wrap}
    .respond-area{margin-top:8px;display:flex;gap:8px;align-items:flex-start}
    .respond-area textarea{min-height:40px}

    .muted{color:#6d6d6d;font-size:0.9rem}
    .closed{opacity:0.6;text-decoration:line-through}

    /* small helper for group-member status toggle (for demo) */
    .member-toggle{font-size:0.9rem;color:#14331f;display:flex;gap:8px;align-items:center}
    .pill{padding:6px 10px;border-radius:15px;border:1px solid #e6f8ea;background:#fff}

    /* responsive */
    @media(max-width:720px){
      .resource-title{max-width:180px}
      header{flex-direction:column;align-items:flex-start;gap:12px}
      .controls{width:100%;justify-content:space-between}
      .add-menu button{width:160px}
    }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- Navigation Buttons -->
    <div class="nav-buttons">
      <button onclick="goHome()">🏠 Home</button>
      <button onclick="goBack()">⬅ Back to Group</button>
    </div>

    <header>
      <div>
        <h1 id="page-heading">Group Registry</h1>
        <div class="muted" id="sub">Registry — add and manage resources for this group</div>
      </div>

      <div class="controls">
        <div class="member-toggle">
          <span class="muted">Group member:</span>
          <label class="pill"><input id="isMember" type="checkbox" checked /> I'm a member</label>
        </div>

        <div class="add-group">
          <button class="add-btn">+ Add resource</button>
          <div class="add-menu" aria-hidden="true">
            <button data-kind="offer">Offering</button>
            <button data-kind="request">Request</button>
          </div>
        </div>
      </div>
    </header>

    <!-- form area appears after choosing Offering / Request -->
    <section class="form-area" id="formArea" aria-hidden="true">
      <form id="resourceForm">
        <input type="hidden" name="kind" id="kind" value="offer">
        <div class="form-row">
          <div style="flex:1 1 320px;min-width:160px">
            <label for="title">Name</label>
            <input id="title" name="title" type="text" required placeholder="e.g. Hay bales, Power drill, Volunteer gardener">
          </div>

          <div style="width:180px">
            <label for="type">Type</label>
            <select id="type" name="type">
              <option>tools</option>
              <option>technology</option>
              <option>labour</option>
              <option>food</option>
              <option>shelter</option>
              <option>land</option>
            </select>
          </div>
        </div>

        <div class="form-row"></div>
          <div style="flex:1 1 320px;min-width:160px">
            <label for="address">Address / Postal</label>
            <input id="address" name="address" type="text" required placeholder="e.g. Hackney E5 8LM">
          </div>

        <div class="form-row">
          <div style="flex:1">
            <label for="description">Description</label>
            <textarea id="description" name="description" placeholder="Describe the resource..."></textarea>
          </div>
        </div>

        <div class="form-row" id="offerControls">
          <div style="display:flex;gap:8px;align-items:center">
            <label class="muted">This is:</label>
            <label><input type="radio" name="fulfil" value="free" checked> Free</label>
            <label><input type="radio" name="fulfil" value="trade"> Trade</label>
          </div>

          <div id="tradeBox" style="flex:1;display:none">
            <label for="tradeDesc">Trade description</label>
            <input id="tradeDesc" name="tradeDesc" type="text" placeholder="What you'd like in exchange">
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn" id="addResourceBtn">Add resource</button>
          <button type="button" class="btn-ghost" id="cancelForm">Cancel</button>
        </div>
      </form>
    </section>

    <!-- Registry list -->
    <section class="registry" id="registryList" aria-live="polite"></section>

  </div>

  <script>
    function goHome() {
      window.location.href = './home.html';
    }

    function goBack() {
      window.history.back();
    }
  </script>

  <script src="resource_registry.js"></script>
</body>
</html>
